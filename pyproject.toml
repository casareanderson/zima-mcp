[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zima-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant check and fix a ZimaBlade (or any Docker host) over plain SSH"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]
keywords = ["mcp", "zimaos", "zimablade", "homelab", "docker", "ssh"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
zima-mcp = "zima_mcp.server:main"

[project.urls]
Homepage = "https://github.com/casareanderson/zima-mcp"

[tool.setuptools]
packages = ["zima_mcp"]
