name: release
# Tag vX.Y.Z -> tests -> build -> PyPI (trusted publishing, no token) -> MCP Registry (GitHub OIDC, no token).
# One-time setup on pypi.org: a pending publisher for project zima-mcp, repo casareanderson/zima-mcp,
# workflow release.yml, environment pypi. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, pyproject and server.json must agree
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
          test "$(jq -r .version server.json)" = "$v" || { echo "server.json version != $v"; exit 1; }
          test "$(jq -r '.packages[0].version' server.json)" = "$v" || { echo "server.json package version != $v"; exit 1; }
          grep -q "mcp-name: $(jq -r .name server.json)" README.md || { echo "README lacks mcp-name line"; exit 1; }
      - run: pip install -e .[test] build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the release to show on PyPI
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/zima-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "zima-mcp $v never appeared on PyPI"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
